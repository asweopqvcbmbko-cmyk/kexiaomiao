<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D2 · 宫格入口</title>
<!--
  D2「宫格入口」—— 功能平权。
  首页不是"今日流水账"，而是一张 2×4 的入口宫格，每个格子直接带实时数据（几门课、几项待办、几条未读、
  空闲几台桩、几天后考试、余额多少）。点进去是独立子页，顶部有返回。
  课表以网格为主，节次列吸顶，横向可滑，列宽比上一版宽 30%。
  课程配色规则同 D1（只散列色相，饱和度明度固定）。
-->
<style>
  :root{
    --bg:#07080b;
    --ink:#eef2f8;
    --ink2:#c3cddb;
    --muted:#8b97a9;
    --line:rgba(255,255,255,.085);
    --glass-bd:rgba(255,255,255,.12);
    --blue:#5b8cff;
    --amber:#ffc86b;
    --red:#ff8f8f;
    --green:#4fd6a0;
    --nav-h:60px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
  .phone{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;
    display:flex;flex-direction:column;overflow:hidden;isolation:isolate;background:#07080b}
  @media (min-width:540px){
    body{padding:20px 0;align-items:flex-start}
    .phone{height:880px;border-radius:34px;border:1px solid rgba(255,255,255,.10);box-shadow:0 28px 70px rgba(0,0,0,.7)}
  }

  .scene{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;
    background:
      radial-gradient(130% 80% at 50% -18%, #1b2a4d 0%, rgba(27,42,77,0) 52%),
      radial-gradient(90% 60% at 100% 30%, #3a2456 0%, rgba(58,36,86,0) 48%),
      radial-gradient(80% 50% at 0% 80%, #0b3a38 0%, rgba(11,58,56,0) 60%),
      #07080b}

  .glass{position:relative;border-radius:18px;
    background:linear-gradient(180deg, rgba(255,255,255,.082), rgba(255,255,255,.03));
    border:1px solid var(--glass-bd);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    backdrop-filter:blur(18px) saturate(160%);
    box-shadow:0 10px 26px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.16)}
  .glass::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,0) 20%)}
  .glass > *{position:relative;z-index:1}

  .top{flex:none;position:relative;z-index:20;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
    background:rgba(7,8,11,.7);
    -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
    border-bottom:1px solid var(--line)}
  .top .r1{display:flex;align-items:center;gap:9px}
  .top h1{margin:0;font-size:19px;font-weight:700;flex:1;min-width:0}
  .top .sub{font-size:10.5px;color:var(--muted);margin-top:3px}
  .back{border:0;background:rgba(255,255,255,.08);color:var(--ink2);width:30px;height:30px;
    border-radius:10px;cursor:pointer;font-family:inherit;font-size:15px;line-height:1;flex:none}
  .btn{border:1px solid var(--glass-bd);background:rgba(255,255,255,.07);color:var(--ink2);
    font-family:inherit;font-size:11.5px;padding:6px 11px;border-radius:10px;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .btn.mini{padding:4px 9px;font-size:11px;border-radius:8px}
  .upd{font-size:10px;color:#6f7a8b;font-variant-numeric:tabular-nums}

  .body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;padding:12px 12px calc(var(--nav-h) + 26px)}
  .body::-webkit-scrollbar{display:none}

  .k{font-size:10.5px;color:var(--muted);letter-spacing:.4px}
  .mt{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.6}
  .num{font-variant-numeric:tabular-nums}
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:16px 4px 8px}
  .sec b{font-size:13px;font-weight:650}
  .sec span{font-size:11px;color:var(--muted)}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 8px;border-radius:999px;
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#c3cddb;white-space:nowrap}
  .chip.amber{border-color:rgba(255,200,107,.36);color:var(--amber);background:rgba(255,200,107,.10)}
  .chip.red{border-color:rgba(255,143,143,.38);color:var(--red);background:rgba(255,143,143,.10)}
  .chip.blue{border-color:rgba(91,140,255,.40);color:#b9cdfd;background:rgba(91,140,255,.12)}
  .chip.green{border-color:rgba(79,214,160,.34);color:var(--green);background:rgba(79,214,160,.10)}

  /* ---------- 首页摘要带 ---------- */
  .hero{padding:15px 15px 14px;margin-bottom:12px}
  .hero .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .hero .date{font-size:25px;font-weight:750;line-height:1.15;letter-spacing:.5px}
  .hero .wd{font-size:12px;color:var(--muted);margin-top:5px}
  .hero .next{margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.09)}
  .hero .nn{font-size:13.5px;font-weight:650;line-height:1.4;margin-top:5px}
  .hero .nm{font-size:11px;color:var(--muted);margin-top:4px}

  /* ---------- 宫格 ---------- */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .tile{padding:12px 12px 13px;cursor:pointer;display:flex;flex-direction:column;min-height:100px}
  .tile .th{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .tile .tt{font-size:12px;font-weight:650;color:var(--ink2)}
  .tile .ti{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.10);flex:none}
  .tile .ti svg{width:14px;height:14px;stroke:#cfe0ff;fill:none;stroke-width:1.8}
  .tile .tv{font-size:21px;font-weight:750;margin-top:auto;line-height:1.1;letter-spacing:.3px}
  .tile .tv small{font-size:11px;font-weight:500;color:var(--muted);margin-left:2px}
  .tile .ts{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5}
  .tile .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.10);margin-top:8px;overflow:hidden}
  .tile .bar i{display:block;height:100%;border-radius:2px;background:var(--green)}

  /* ---------- 通用行 ---------- */
  .task{display:flex;gap:10px;align-items:center;padding:11px 12px;margin-bottom:7px}
  .task .bar{flex:none;width:3px;align-self:stretch;border-radius:2px;background:#3b4453}
  .task .bar.amber{background:var(--amber)}
  .task .bar.red{background:var(--red)}
  .task .tb{flex:1;min-width:0}
  .task .tn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task .ts{font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task .ta{flex:none;display:flex;gap:6px}
  .done{color:var(--green);border-color:rgba(79,214,160,.36);background:rgba(79,214,160,.10)}

  .lesson{display:flex;border-radius:14px;overflow:hidden;margin-bottom:7px;cursor:pointer;
    border:1px solid var(--c-bd);background:var(--c-fill)}
  .lesson .tm{flex:none;width:76px;padding:10px 8px 10px 11px;border-right:1px solid var(--c-bd);
    font-size:11px;font-weight:650;color:var(--c-text);line-height:1.35}
  .lesson .tm i{display:block;font-style:normal;font-size:9.5px;font-weight:400;opacity:.62;margin-top:3px}
  .lesson .ct{flex:1;min-width:0;padding:10px 11px}
  .lesson .cn{font-size:13.5px;font-weight:650;line-height:1.35;color:#f4f7fc;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lesson .cd{font-size:10.5px;color:#b9c6da;opacity:.82;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lesson .cw{display:inline-block;margin-top:4px;font-size:9.5px;color:var(--amber)}

  /* ---------- 网格（节次列吸顶） ---------- */
  .gwrap{overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .gwrap::-webkit-scrollbar{display:none}
  .grid{display:grid;grid-template-columns:22px repeat(7, minmax(42px,1fr));gap:3px}
  .grid .gh{font-size:10px;color:var(--muted);text-align:center;padding:2px 0 7px}
  .grid .gh.today{color:var(--amber);font-weight:700}
  .grid .gp{font-size:9.5px;color:#5b6472;text-align:center;padding-top:9px;
    position:sticky;left:0;background:rgba(7,8,11,.92);z-index:2;border-radius:4px}
  .gcell{position:relative;min-height:46px;border-radius:8px;padding:4px;overflow:hidden;
    border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.025)}
  .gcell.has{border-color:var(--c-bd);background:var(--c-fill)}
  .gcell .gn{font-size:9.5px;font-weight:650;line-height:1.26;color:#f1f5fb;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .gcell .gr{font-size:8px;color:#aab7c9;opacity:.82;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gcw{position:absolute;top:3px;right:3px;width:13px;height:13px;border-radius:50%;border:0;padding:0;
    background:var(--amber);color:#1b1305;font-family:inherit;font-size:9px;font-weight:800;line-height:13px;
    text-align:center;cursor:pointer;box-shadow:0 0 6px rgba(255,200,107,.6)}

  /* ---------- 通知/考试/充电桩 ---------- */
  .nrow{padding:12px 13px;margin-bottom:7px;cursor:pointer}
  .nt{font-size:12.5px;font-weight:600;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .nm{display:flex;gap:8px;align-items:center;font-size:10px;color:var(--muted);margin-top:5px}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--blue);flex:none}
  .nrow.read .dot{background:#3b4453}
  .nrow.read .nt{color:#aab5c4}
  .crow{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:6px}
  .cb{flex:1;min-width:0}
  .ca{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cs{font-size:10px;color:var(--muted);margin-top:3px}
  .cp{flex:none;width:72px;height:5px;border-radius:3px;background:rgba(255,255,255,.10);overflow:hidden}
  .cp i{display:block;height:100%;border-radius:3px;background:var(--green)}
  .cp.none i{background:#3b4453}
  .cn2{flex:none;text-align:right;font-size:11px;font-variant-numeric:tabular-nums;min-width:50px}
  .cn2 b{font-size:13px}

  /* ---------- 导航 ---------- */
  .nav{position:absolute;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
    padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;
    background:rgba(7,8,11,.76);
    -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
    border-top:1px solid var(--line)}
  .nav button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:none;border:0;cursor:pointer;font-family:inherit;font-size:10px;color:#67707f}
  .nav button.on{color:#cfe0ff}
  .nav .ic{width:19px;height:19px}
  .nav button.on .ic{filter:drop-shadow(0 0 7px rgba(91,140,255,.6))}

  .mask{position:fixed;inset:0;z-index:60;background:rgba(4,6,9,.62);display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:440px;max-height:82vh;overflow-y:auto;scrollbar-width:none;
    border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg, rgba(28,33,42,.97), rgba(15,18,24,.99));
    border:1px solid var(--glass-bd);border-bottom:0}
  .sheet::-webkit-scrollbar{display:none}
  .sheet h2{margin:0;font-size:17px;font-weight:700;line-height:1.4}
  .kv{display:flex;gap:12px;justify-content:space-between;padding:9px 0;
    border-bottom:1px solid rgba(255,255,255,.07);font-size:12px}
  .kv span{color:var(--muted);flex:none}
  .kv b{font-weight:600;text-align:right;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px);transform:translateX(-50%);z-index:80;
    padding:8px 14px;border-radius:999px;font-size:11.5px;color:#0b0d12;background:#dfe7f5;
    box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .18s;pointer-events:none}
  .toast.on{opacity:1}
  .page{display:none}.page.on{display:block}
  .empty{text-align:center;color:#5b6472;font-size:11.5px;padding:22px 0}
  .note{font-size:10px;color:#5b6472;text-align:center;margin:14px 0 2px;line-height:1.7}
  .divider{height:1px;background:var(--line);margin:10px -14px}
</style>
</head>
<body>
<div class="phone">
  <div class="scene"></div>

  <header class="top">
    <div class="r1">
      <button class="back" id="back" style="display:none">←</button>
      <div style="flex:1;min-width:0">
        <h1 id="h1">校园</h1>
        <div class="sub" id="sub">孙圣益 · 第 10 周 · 2026-2027-1</div>
      </div>
      <span class="upd" id="upd">13:58</span>
      <button class="btn mini" id="refresh">刷新</button>
    </div>
  </header>

  <div class="body" id="body"></div>

  <nav class="nav" id="nav">
    <button data-tab="home" class="on">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/></svg>校园
    </button>
    <button data-tab="table">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M9 9v12M15 9v12"/></svg>课表
    </button>
    <button data-tab="task">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h11M4 12h16M4 17h9"/><path d="M18 6l2 2 3-3"/></svg>任务
    </button>
    <button data-tab="settings">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.4 3.1-5.6 7-5.6s7 2.2 7 5.6"/></svg>我的
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script src="data.js"></script>
<script>
var D = window.DATA;
var WEEK_KEY='haust.demo.week', DONE_KEY='haust.demo.done', READ_KEY='haust.demo.read';
function lsGet(k,d){ try{ return JSON.parse(localStorage.getItem(k)) || d }catch(e){ return d } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }

var S = {
  tab:'home', week:Number(lsGet(WEEK_KEY,10))||10, view:'grid',
  noticeSrc:'all', done:lsGet(DONE_KEY,[]), read:lsGet(READ_KEY,[]),
  sheet:null, upd:'13:58', scrollTop:0
};

var WD=['周一','周二','周三','周四','周五','周六','周日'];
var TODAY_WD=4, PERIODS=12;
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c] }) }

var ANCHOR=222;
function hueOf(name){
  var h=0; for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))%100000;
  var t=h%240, hue=t<120?ANCHOR+30+Math.round(t*0.78):ANCHOR+210+(t-120);
  return ((hue%360)+360)%360;
}
function courseVars(name){
  var h=hueOf(name);
  return '--c-fill:hsl('+h+',42%,26%);--c-bd:hsl('+h+',46%,40%);--c-text:hsl('+h+',72%,78%);';
}
var SHORT = {
  '线性代数A':'线代','高等数学A(1)':'高数','马克思主义基本原理':'马原','电工与电子技术B':'电工',
  '工程力学A（1）':'力学','工程图学B(1)':'图学','毛泽东思想和中国特色社会主义理论体系概论':'毛概',
  '大学英语C（3）':'大英','体育(3） 足球':'体育'
};
function shortName(n){ return SHORT[n] || String(n).slice(0,2) }
function weeksInclude(weeks,w){
  if(!weeks) return true;
  var parts=String(weeks).replace(/[\[\]]/g,'').split(',');
  for(var i=0;i<parts.length;i++){
    var p=parts[i].trim(); if(!p) continue;
    var m=p.match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){ if(w>=+m[1]&&w<=+m[2]) return true; continue }
    if(Number(p)===w) return true;
  }
  return false;
}
function gridOf(week){
  var map={};
  D.courses.forEach(function(c){ (c.slots||[]).forEach(function(s){
    if(!weeksInclude(s.weeks,week)) return;
    (s.p||[]).forEach(function(p){ var k=s.w+'-'+p;
      if(!map[k]) map[k]=[];
      map[k].push({course:c,room:s.r}) }) }) });
  return map;
}
function dayBlocks(wd,week){
  var map=gridOf(week), blocks=[];
  for(var p=1;p<=shownPeriods();p++){
    var cell=map[wd+'-'+p]; if(!cell) continue;
    cell.forEach(function(item){
      var last=blocks[blocks.length-1];
      if(last&&last.course.n===item.course.n&&last.to===p-1&&last.room===item.room) last.to=p;
      else blocks.push({course:item.course,room:item.room,from:p,to:p});
    });
  }
  blocks.forEach(function(b){
    var cell=map[wd+'-'+b.from]||[];
    var others=cell.map(function(x){return x.course.n}).filter(function(n){return n!==b.course.n});
    if(others.length) b.conflict=others.filter(function(v,i,a){return a.indexOf(v)===i});
  });
  blocks.sort(function(a,b){return a.from-b.from});
  return blocks;
}

var PRACTICES=[
  {key:'act|1',title:'2.1节课后作业解答过程',course:'高等数学A(1)-2026级',state:'进行中',remain:'还剩 15 小时 56 分'},
  {key:'act|2',title:'while 语句',course:'26-27-1学期C语言程序设计',state:'进行中',remain:'已开始 19 小时'},
  {key:'act|3',title:'定义考查',course:'高等数学A(1)-2026级',state:'进行中',remain:'还剩 18 小时 30 分'}
];
var WORKS=[
  {key:'work|P7',title:'P7',course:'工程图学2026-2027',state:'未交',due:'截止 11-05 23:36',remain:'还剩 10 小时 16 分',bucket:'today'},
  {key:'work|P6',title:'P6圆柱圆锥截切(B)',course:'工程图学2026-2027',state:'未交',due:'截止 11-05 23:36',remain:'还剩 10 小时 16 分',bucket:'today'},
  {key:'work|ch11',title:'第十一章白皮作业',course:'高等数学A(2)（2025级）',state:'待互评',due:'截止 不限时',remain:'',bucket:'none'}
];
function isDone(k){ return S.done.indexOf(k)>=0 }
function allTasks(){
  var l=[];
  PRACTICES.forEach(function(t){ if(!isDone(t.key)) l.push({t:t,kind:'practice'}) });
  WORKS.forEach(function(t){ if(!isDone(t.key)) l.push({t:t,kind:'work'}) });
  return l;
}
function markDone(k){
  if(!isDone(k)) S.done.push(k);
  lsSet(DONE_KEY,S.done);
  toast('已标记完成，刷新后也不会再出现');
  render();
}

var SUB = ['exam','notice','charger'];
var TITLES={
  home:['校园','孙圣益 · 第 10 周 · 2026-2027-1'],
  table:['课表','第 10 周 · 6 门课 · 8 处冲突'],
  task:['学习任务','随堂与作业 · 共 6 项'],
  exam:['考试安排','已发布 8 场'],
  notice:['通知','51 条未读'],
  charger:['充电桩','开元校区 · 13 个点位'],
  settings:['我的','账号与本地数据']
};

function render(){
  var t=TITLES[S.tab]||['',''];
  document.getElementById('h1').textContent=t[0];
  document.getElementById('sub').textContent=t[1];
  if (S.tab === 'table'){ var ws = weekSummary(); document.getElementById('sub').textContent = '第 ' + S.week + ' 周 · ' + ws.courses + ' 门课' + (ws.conflicts ? ' · ' + ws.conflicts + ' 处冲突' : '') }
  document.getElementById('upd').textContent=S.upd;
  document.getElementById('back').style.display=(SUB.indexOf(S.tab)>=0)?'block':'none';

  var nav=document.getElementById('nav');
  var active=(S.tab==='home'||S.tab==='table'||S.tab==='task'||S.tab==='settings')?S.tab:null;
  Array.prototype.forEach.call(nav.querySelectorAll('button'),function(b){
    b.classList.toggle('on',b.getAttribute('data-tab')===active);
  });

  var html='';
  if(S.tab==='home') html=viewHome();
  else if(S.tab==='table') html=viewTable();
  else if(S.tab==='task') html=viewTask();
  else if(S.tab==='exam') html=viewExam();
  else if(S.tab==='notice') html=viewNotice();
  else if(S.tab==='charger') html=viewCharger();
  else if(S.tab==='settings') html=viewSettings();

  document.getElementById('body').innerHTML=html+sheetHtml();
  bind();
  document.getElementById('body').scrollTop=S.scrollTop||0;
}

function sheetHtml(){
  if(!S.sheet) return '';
  var s=S.sheet;
  if(s.type==='course'){
    var c=s.payload;
    var slots=(c.slots||[]).map(function(x){
      return WD[x.w-1]+' 第'+(x.p||[]).join(',')+'节 '+(x.r||'—')+'（'+x.weeks+'）';
    }).join('<br>');
    return '<div class="mask" data-close="1"><div class="sheet">'
      +'<h2>'+esc(c.n)+'</h2>'
      +'<div class="mt" style="margin-bottom:8px">'+esc(c.code||'')+' · '+esc(c.cat||'')+' · '+esc(c.exam||'')+'</div>'
      +'<div class="kv"><span>任课教师</span><b>'+esc(c.t||'—')+'</b></div>'
      +'<div class="kv"><span>学分 / 学时</span><b>'+esc(c.credit||'—')+' 学分 · '+esc(c.hours||'—')+' 学时</b></div>'
      +'<div class="kv"><span>起止周</span><b>'+esc(c.weeks||'—')+'</b></div>'
      +'<div class="kv" style="align-items:flex-start"><span>上课安排</span><b>'+(slots||'线上课程，无固定教室')+'</b></div>'
      +'<button class="btn" style="width:100%;margin-top:14px" data-close="1">关闭</button>'
      +'</div></div>';
  }
  if(s.type==='notice'){
    var n=s.payload;
    return '<div class="mask" data-close="1"><div class="sheet">'
      +'<h2>'+esc(n.t)+'</h2>'
      +'<div class="mt">'+esc(n.sn)+' · '+esc(n.d)+'</div>'
      +'<div class="kv" style="margin-top:8px"><span>正文</span><b>需要联网从学校站点抓取<br>（桌面端点开即可读全文）</b></div>'
      +'<button class="btn" style="width:100%;margin-top:14px" data-close="1">关闭</button>'
      +'</div></div>';
  }
  return '';
}

function tile(title,icon,value,sub,tab,tone,pct){
  var color = tone==='amber'?'#ffc86b':tone==='green'?'#4fd6a0':tone==='blue'?'#5b8cff':'#cfe0ff';
  var svg={
    grid:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M9 9v12M15 9v12"/>',
    check:'<path d="M4 7h11M4 12h16M4 17h9"/><path d="M18 6l2 2 3-3"/>',
    bell:'<path d="M6 9a6 6 0 0 1 12 0v5l2 3H4l2-3z"/><path d="M10 20h4"/>',
    cap:'<path d="M3 9l9-4 9 4-9 4z"/><path d="M7 12v5c0 1.5 2.2 3 5 3s5-1.5 5-3v-5"/>',
    bolt:'<path d="M13 2L5 13h6l-1 9 8-11h-6z"/>',
    card:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
    book:'<path d="M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M17 7h2v13h-2"/>'
  }[icon]||'';
  return '<div class="tile glass" data-tab="'+tab+'">'
    +'<div class="th"><div class="tt">'+title+'</div><div class="ti"><svg viewBox="0 0 24 24" style="stroke:'+color+'">'+svg+'</svg></div></div>'
    +(value?'<div class="tv" style="color:'+color+'">'+value+'</div>':'<div class="tv"></div>')
    +'<div class="ts">'+sub+'</div>'
    +(pct!=null?'<div class="bar"><i style="width:'+Math.round(pct)+'%"></i></div>':'')
    +'</div>';
}

/* ---------- 课表 ---------- */
function viewTable(){
  var h='<div class="row" style="justify-content:space-between;margin:2px 2px 10px;display:flex">'
    +'<div style="display:flex;gap:6px;align-items:center">'
    +'<button class="btn mini" data-week="-1">◀</button>'
    +'<span class="chip blue">第 '+S.week+' 周</span>'
    +'<button class="btn mini" data-week="1">▶</button>'
    +'<button class="btn mini" data-week="0">本周</button>'
    +'</div>'
    +'<button class="btn mini" data-view="'+(S.view==='grid'?'list':'grid')+'">'+(S.view==='grid'?'按天':'网格')+'</button>'
    +'</div>';

  if(S.view==='grid'){
    h+=gridView2();
  } else {
    for(var wd=1;wd<=7;wd++){
      var blocks=dayBlocks(wd,S.week);
      if(!blocks.length) continue;
      h+='<div class="sec"><b>'+WD[wd-1]+'</b><span>'+blocks.length+' 门</span></div>';
      blocks.forEach(function(b){ h+=lessonCard(b) });
    }
    var total=0; for(var d=1;d<=7;d++) total+=dayBlocks(d,S.week).length;
    if(!total) h+='<div class="empty">第 '+S.week+' 周没有课</div>';
  }
  h+='<div class="note">点格子看详情 · 右上角黄点=同一节还排了另一门，点黄点看那门 · 节次列吸顶</div>';
  return h;
}

function lessonCard(b){
  return '<div class="lesson" style="'+courseVars(b.course.n)+'" data-course="'+esc(b.course.n)+'">'
    +'<div class="tm">第 '+b.from+(b.to>b.from?'–'+b.to:'')+' 节<i>'+(b.to-b.from+1)+' 节</i></div>'
    +'<div class="ct"><div class="cn">'+esc(b.course.n)+'</div>'
    +'<div class="cd">'+esc(b.course.t||'—')+' · '+esc(b.room||'—')+'</div>'
    +(b.conflict?'<span class="cw">⚠ 同时排了 '+esc(b.conflict.join('、'))+'</span>':'')
    +'</div></div>';
}

function gridView2(){
  var map=gridOf(S.week);
  var h='<div class="gwrap"><div class="grid">';
  h+='<div class="gh"></div>';
  for(var i=1;i<=7;i++) h+='<div class="gh'+(i===TODAY_WD?' today':'')+'">'+WD[i-1].slice(1)+'</div>';
  for(var p=1;p<=shownPeriods();p++){
    h+='<div class="gp">'+p+'</div>';
    for(var wd=1;wd<=7;wd++){
      var cell=map[wd+'-'+p];
      if(!cell||!cell.length){ h+='<div class="gcell"></div>'; continue }
      var first=cell[0], others=cell.slice(1);
      h+='<div class="gcell has" style="'+courseVars(first.course.n)+'" data-course="'+esc(first.course.n)+'">'
        +'<div class="gn">'+esc(first.course.n)+'</div>'
        +'<div class="gr">'+esc(shortRoom(first.room||''))+'</div>'
        +others.map(function(o){ return '<button class="gcw" title="'+esc(o.course.n)+'（撞课）" data-course="'+esc(o.course.n)+'">!</button>' }).join('')
        +'</div>';
    }
  }
  return h+'</div></div>';
}

/* ---------- 任务 ---------- */
function viewTask(){
  var list=allTasks();
  var prac=list.filter(function(x){return x.kind==='practice'});
  var today=list.filter(function(x){return x.kind==='work'&&x.t.bucket==='today'});
  var none=list.filter(function(x){return x.kind==='work'&&x.t.bucket==='none'});
  var h='<div class="card glass" style="padding:14px"><div style="display:flex;justify-content:space-between;align-items:center">'
    +'<div><div class="k">未完成</div><div class="num" style="font-size:22px;font-weight:750">'+list.length+' 项</div>'
    +'<div class="mt">随堂 '+prac.length+' · 作业 '+(list.length-prac.length)+'</div></div>'
    +'<span class="chip red">今天 2 份截止</span></div></div>';
  function group(title,arr,bc){
    if(!arr.length) return '';
    var s='<div class="sec"><b>'+title+'</b><span>'+arr.length+'</span></div>';
    arr.forEach(function(x){
      s+='<div class="task glass"><i class="bar '+(x.kind==='practice'?'amber':bc)+'"></i>'
        +'<div class="tb"><div class="tn">'+esc(x.t.title)+'</div>'
        +'<div class="ts">'+esc(x.t.course)+' · '+esc(x.t.state)+(x.t.remain?' · '+esc(x.t.remain):'')+'</div></div>'
        +'<div class="ta"><button class="btn mini" data-open="1">打开</button>'
        +'<button class="btn mini done" data-done="'+x.t.key+'">✓ 完成</button></div></div>';
    });
    return s;
  }
  h+=group('进行中',prac,'amber');
  h+=group('今天截止',today,'red');
  h+=group('未标截止时间',none,'');
  var hidden=(PRACTICES.length+WORKS.length)-list.length;
  h+='<div class="note">'+(hidden?'已隐藏 '+hidden+' 项「✓ 完成」· ':'')+'点过的记在本机，刷新不复发</div>';
  return h;
}

function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){el.classList.remove('on')},1900);
}
function findCourse(n){ for(var i=0;i<D.courses.length;i++) if(D.courses[i].n===n) return D.courses[i]; return null }

function bind(){
  var body=document.getElementById('body');
  Array.prototype.forEach.call(body.querySelectorAll('[data-course]'),function(el){
    el.addEventListener('click',function(ev){
      ev.stopPropagation();
      var c=findCourse(el.getAttribute('data-course'));
      if(c){ S.sheet={type:'course',payload:c}; S.scrollTop=body.scrollTop; render() }
    });
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-done]'),function(el){
    el.addEventListener('click',function(ev){ ev.stopPropagation(); markDone(el.getAttribute('data-done')) });
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-week]'),function(el){
    el.addEventListener('click',function(){
      var d=Number(el.getAttribute('data-week'));
      S.week = d===0 ? 10 : Math.min(20,Math.max(1,S.week+d));
      lsSet(WEEK_KEY,S.week); S.scrollTop=0; render();
    });
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-view]'),function(el){
    el.addEventListener('click',function(){ S.view=el.getAttribute('data-view'); render() });
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-tab]'),function(el){
    el.addEventListener('click',function(){ S.tab=el.getAttribute('data-tab'); S.scrollTop=0; render() });
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-src]'),function(el){
    el.addEventListener('click',function(){ S.noticeSrc=el.getAttribute('data-src'); render() });
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-notice]'),function(el){
    el.addEventListener('click',function(){
      var i=Number(el.getAttribute('data-notice'));
      var n=D.notices[i]; if(!n) return;
      var key=n.s+'|'+i;
      if(S.read.indexOf(key)<0){ S.read.push(key); lsSet(READ_KEY,S.read) }
      S.sheet={type:'notice',payload:n}; S.scrollTop=body.scrollTop; render();
    });
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-open]'),function(el){
    el.addEventListener('click',function(){ toast('演示版不打开外部页面') });
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-cleardone]'),function(el){
    el.addEventListener('click',function(){ S.done=[]; lsSet(DONE_KEY,S.done); toast('已清除完成标记'); render() });
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-clearcache]'),function(el){
    el.addEventListener('click',function(){ toast('演示版不清真的缓存') });
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-clearcred]'),function(el){
    el.addEventListener('click',function(){ toast('演示版不动真实凭据') });
  });
  Array.prototype.forEach.call(body.querySelectorAll('[data-close]'),function(el){
    el.addEventListener('click',function(){ S.sheet=null; render() });
  });
}

/* ------------------------------------------------------------------
   覆盖 dayBlocks：先按「课程+教室」把连续节次合并，再标撞课。
   原实现按出现顺序合并，一撞课就会把同一门课拆成 1 节一块（周一变 4 张卡）。
   ------------------------------------------------------------------ */
/* 只画到本周实际用到的节次（最少 8 节），别让一整屏空行占着 */
/* 网格里列宽只有 4x px，教室名压缩成 "5-302 / 农214" */
function shortRoom(r){
  return String(r || '').replace(/^开元/, '').replace(/^公教/, '').replace(/^农医教-?/, '农').replace(/^农医教/, '农');
}
function shownPeriods(){
  var map = gridOf(S.week), max = 0;
  Object.keys(map).forEach(function(k){
    var p = Number(String(k).split('-')[1]);
    if (p > max) max = p;
  });
  return Math.max(max || 8, 8);
}
function weekSummary(){
  var set = {}, conf = 0, map = gridOf(S.week);
  Object.keys(map).forEach(function(k){
    var cell = map[k];
    cell.forEach(function(x){ set[x.course.n] = 1 });
    if (cell.length > 1) conf += 1;
  });
  return { courses: Object.keys(set).length, conflicts: conf };
}
function dayBlocks(wd, week){
  var map = gridOf(week);
  var byCourse = {}, order = [];
  for (var p = 1; p <= shownPeriods(); p++){
    var cell = map[wd + '-' + p];
    if (!cell) continue;
    cell.forEach(function(it){
      var k = it.course.n + '|' + it.room;
      if (!byCourse[k]){ byCourse[k] = { course: it.course, room: it.room, ps: [] }; order.push(k) }
      byCourse[k].ps.push(p);
    });
  }
  var blocks = [];
  order.forEach(function(k){
    var g = byCourse[k];
    g.ps.sort(function(a, b){ return a - b });
    var start = g.ps[0], prev = g.ps[0];
    for (var i = 1; i <= g.ps.length; i++){
      var p = g.ps[i];
      if (p === prev + 1){ prev = p; continue }
      blocks.push({ course: g.course, room: g.room, from: start, to: prev });
      start = p; prev = p;
    }
  });
  var cellNames = {};
  for (var q = 1; q <= PERIODS; q++){
    var c = map[wd + '-' + q];
    if (c) cellNames[q] = c.map(function(x){ return x.course.n });
  }
  blocks.forEach(function(b){
    var set = [];
    for (var p = b.from; p <= b.to; p++){
      (cellNames[p] || []).forEach(function(n){
        if (n !== b.course.n && set.indexOf(n) < 0) set.push(n);
      });
    }
    if (set.length) b.conflict = set;
  });
  return blocks.sort(function(a, b){ return a.from - b.from });
}
